<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expressions Classifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#4fc3ff; --sky2:#c8efff; --ink:#0b3a5c; --panel:rgba(255,255,255,.85); --card:#ffffff; --edge:#b9dff3;
  --ask:#0369a1; --askBg:#dff3ff; --give:#b45309; --giveBg:#fff1c2; --resp:#047857; --respBg:#d6f7e8;
  --pink:#e11d48; --shadow:rgba(8,70,120,.28); --sun:#ffd23f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#14275a; --sky2:#31508f; --ink:#eaf4ff; --panel:rgba(16,30,66,.82); --card:#25427f; --edge:#13285a;
    --askBg:#12365a; --giveBg:#4a3a10; --respBg:#0f3d33; --shadow:rgba(0,0,0,.45); --sun:#e9e3c2;
  }
}
:root[data-theme="dark"]{
  --sky1:#14275a; --sky2:#31508f; --ink:#eaf4ff; --panel:rgba(16,30,66,.82); --card:#25427f; --edge:#13285a;
  --askBg:#12365a; --giveBg:#4a3a10; --respBg:#0f3d33; --shadow:rgba(0,0,0,.45); --sun:#e9e3c2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky1)}
body{
  font-family:'Outfit',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);background-attachment:fixed;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;position:relative
}
.sun{position:fixed;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:var(--sun);opacity:.85;
  box-shadow:0 0 0 24px rgba(255,255,255,.18),0 0 0 54px rgba(255,255,255,.1);pointer-events:none}
.cloud{position:fixed;font-size:56px;opacity:.7;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.c1{top:18%;left:4%}.c2{bottom:10%;right:5%;font-size:72px;animation-duration:22s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(40px) translateY(-14px)}}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}

header{background:var(--panel);border:3px solid var(--card);border-radius:24px;padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 0 var(--edge),0 14px 26px var(--shadow)}
h1{font-family:'Fredoka',sans-serif;font-size:clamp(20px,4.6vw,30px);font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.1}
h1 .mascot{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:'Fredoka',sans-serif;font-weight:700;font-size:17px;background:#ffd23f;color:#5a3a00;border-radius:999px;padding:6px 14px;border:3px solid #fff;box-shadow:0 4px 0 #e0a800}
.pill.streak{background:#ff6b3d;color:#fff;box-shadow:0 4px 0 #c4421a;display:none}
.pill.streak.on{display:inline-block;animation:pop .35s}
.btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;color:#fff;background:#0284c7;border:3px solid #fff;border-radius:16px;padding:6px 14px;cursor:pointer;box-shadow:0 5px 0 #035a8c;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #035a8c}
.btn.mute{padding:6px 10px;background:#7c3aed;box-shadow:0 5px 0 #5421a8}

.progress{background:var(--panel);border:3px solid var(--card);border-radius:999px;height:26px;position:relative;overflow:hidden;box-shadow:0 5px 0 var(--edge)}
.progress i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,#34d399 0 14px,#10b981 14px 28px);border-radius:999px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.progress b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:14px;color:var(--ink)}

.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bin{border-radius:26px;padding:12px 10px 14px;min-height:230px;display:flex;flex-direction:column;align-items:center;gap:10px;
  border:4px dashed;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;box-shadow:0 8px 0 var(--edge),0 14px 24px var(--shadow)}
.bin-ask{background:var(--askBg);border-color:var(--ask)}
.bin-give{background:var(--giveBg);border-color:var(--give)}
.bin-respond{background:var(--respBg);border-color:var(--resp)}
.bin-head{font-family:'Fredoka',sans-serif;font-weight:700;color:#fff;font-size:clamp(15px,3.6vw,22px);padding:6px 16px;border-radius:999px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.bin-ask .bin-head{background:var(--ask)}.bin-give .bin-head{background:var(--give)}.bin-respond .bin-head{background:linear-gradient(90deg,var(--resp) 55%,var(--pink))}
.holder{width:100%;display:flex;flex-direction:column;gap:7px;flex:1}
.holder:empty::before{content:"⤵";margin:auto;font-size:44px;opacity:.35;animation:bob 1.8s ease-in-out infinite}
.bin.hot{transform:scale(1.05) rotate(-1deg);border-style:solid;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 0 34px rgba(255,255,255,.9)}
.bin.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

.deck{background:var(--panel);border:3px solid var(--card);border-radius:26px;padding:14px;box-shadow:0 8px 0 var(--edge),0 14px 26px var(--shadow)}
.deck-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(15px,3.4vw,18px);text-align:center;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:110px;padding:6px}
.card{--r:0deg;font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(14px,3.6vw,17px);color:var(--ink);background:var(--card);
  border:3px solid #fff;border-bottom-width:7px;border-bottom-color:var(--edge);border-radius:18px;padding:10px 10px 8px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:grab;touch-action:none;
  transform:rotate(var(--r));transition:transform .15s,box-shadow .15s;box-shadow:0 8px 14px var(--shadow);animation:dealIn .5s backwards}
@keyframes dealIn{from{transform:translateY(30px) scale(.6);opacity:0}}
.card:hover{transform:rotate(0) translateY(-4px) scale(1.04)}
.card.dragging{cursor:grabbing;z-index:1000;transform:scale(1.12) rotate(-3deg);box-shadow:0 22px 34px var(--shadow);animation:none}
.card.back{animation:wobble .5s}
@keyframes wobble{25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.card.placed{cursor:default;width:100%;justify-content:center;text-align:center;padding:8px 8px 6px;border-bottom-width:5px;box-shadow:none;transform:none;font-size:clamp(12px,3vw,15px);animation:pop .4s}
.card.placed .spk{display:none}
.bin-ask .card.placed{border-bottom-color:var(--ask)}.bin-give .card.placed{border-bottom-color:var(--give)}.bin-respond .card.placed{border-bottom-color:var(--resp)}
.spk{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:#38bdf8;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #0b79ad;line-height:1}
.spk:active{transform:translateY(2px)}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
  padding:10px 24px;border-radius:999px;border:3px solid #fff;box-shadow:0 8px 0 #9f1239,0 14px 26px var(--shadow);z-index:2000;display:none;max-width:92vw;text-align:center}
.toast.show{display:block;animation:pop .3s}
.float{position:fixed;font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;color:#fff;-webkit-text-stroke:2px #0b8f5a;paint-order:stroke fill;pointer-events:none;z-index:1500}
.bit{position:fixed;width:11px;height:11px;border-radius:3px;pointer-events:none;z-index:1500}
.win{position:fixed;inset:0;background:rgba(5,25,50,.6);display:none;align-items:center;justify-content:center;z-index:3000;padding:20px}
.win.show{display:flex}
.win-card{background:var(--card);border:5px solid #fff;border-radius:32px;padding:26px 28px;text-align:center;max-width:380px;box-shadow:0 10px 0 var(--edge),0 24px 50px rgba(0,0,0,.4);animation:pop .5s}
.win-card h2{font-family:'Fredoka',sans-serif;font-size:32px;margin:4px 0}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:pop .6s backwards}
.win-card p{font-family:'Fredoka',sans-serif;font-size:20px;margin-bottom:16px}
@media (max-width:640px){
  body{padding:8px}.targets{gap:6px}.bin{padding:10px 5px 12px;border-width:3px;min-height:200px}
  .bin-head{padding:5px 10px}.card.placed{padding:6px 4px 5px}.pill{font-size:15px;padding:5px 11px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sun"></div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>

<div class="wrap">
  <header>
    <h1><span class="mascot">💬</span> Expressions Classifier</h1>
    <div class="hud">
      <div class="pill">Score: <span id="scoreText">0</span></div>
      <div class="pill streak" id="streak">🔥 x2</div>
      <button class="btn mute" id="muteBtn" aria-label="Sound on/off">🔔</button>
      <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
  </header>

  <div class="progress" aria-label="Progress"><i id="bar"></i><b id="barText">0 / 12</b></div>

  <div class="targets">
    <div class="bin bin-ask" data-target="ASK"><div class="bin-head">❓ ASK</div><div class="holder" id="container-ASK"></div></div>
    <div class="bin bin-give" data-target="GIVE"><div class="bin-head">💡 GIVE</div><div class="holder" id="container-GIVE"></div></div>
    <div class="bin bin-respond" data-target="RESPOND"><div class="bin-head">💬 RESPOND</div><div class="holder" id="container-RESPOND"></div></div>
  </div>

  <div class="deck">
    <div class="deck-title">👇 Seret / Drag ekspresi di bawah ini ke kotak yang sesuai:</div>
    <div class="pool" id="cardsPool"></div>
  </div>
</div>

<div class="toast" id="toast">Opps! Coba kotak yang lain!</div>
<div class="win" id="win"><div class="win-card">
  <div style="font-size:64px">🏆</div><h2>Hebat! Great job!</h2>
  <div class="stars" id="stars"></div>
  <p>Score: <span id="finalScore">0</span> / 120</p>
  <button class="btn" id="againBtn">🔄 Reset</button>
</div></div>

<script>
const EXPRESSIONS_DATA = [
  { id: 1, text: "What do you think about...?", category: "ASK" },
  { id: 2, text: "What is your opinion about...?", category: "ASK" },
  { id: 3, text: "How do you feel about...?", category: "ASK" },
  { id: 4, text: "Do you think...?", category: "ASK" },
  { id: 5, text: "I think...", category: "GIVE" },
  { id: 6, text: "In my opinion...", category: "GIVE" },
  { id: 7, text: "I believe...", category: "GIVE" },
  { id: 8, text: "For me...", category: "GIVE" },
  { id: 9, text: "I agree with you.", category: "RESPOND" },
  { id: 10, text: "That’s true!", category: "RESPOND" },
  { id: 11, text: "I disagree.", category: "RESPOND" },
  { id: 12, text: "I don’t think so.", category: "RESPOND" }
];
const TOTAL = EXPRESSIONS_DATA.length;
let score = 0, placed = 0, streak = 0, mistakes = 0, muted = false;
let activeCard = null, touchOffset = {x:0,y:0}, cardOriginalParent = null, naturalVoice = null, audioCtx = null;
const $ = id => document.getElementById(id);

/* ---------- sound ---------- */
function tone(freq, start, dur, type, vol){
  if (muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}
const sfxGood = () => { tone(660,0,.14,'triangle'); tone(880,.1,.2,'triangle'); };
const sfxBad  = () => { tone(180,0,.25,'sawtooth',.08); tone(140,.12,.25,'sawtooth',.08); };
const sfxWin  = () => [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'triangle'));

/* ---------- voice ---------- */
function loadNaturalVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  naturalVoice = voices.find(v => v.lang.startsWith('en') && ['Google','Natural','Premium','Samantha','Jenny','Guy','Karen'].some(n => v.name.includes(n)))
    || voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB') || voices[0];
}
if ('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadNaturalVoice; loadNaturalVoice(); }
function speakText(text){
  if (!('speechSynthesis' in window) || muted) return;
  speechSynthesis.cancel();
  let clean = text.replace(/\.\.\./g, ' something?');
  if (!text.includes('?') && !text.includes('!')) clean = text.replace(/\.\.\./g, '...');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US'; u.rate = .88; u.pitch = 1; u.volume = 1;
  if (naturalVoice) u.voice = naturalVoice;
  speechSynthesis.speak(u);
}

/* ---------- effects ---------- */
function confetti(x, y){
  const colors = ['#ff6b3d','#ffd23f','#34d399','#38bdf8','#a78bfa','#f43f5e'];
  for (let i = 0; i < 22; i++){
    const b = document.createElement('div'); b.className = 'bit';
    b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.background = colors[i % colors.length];
    document.body.appendChild(b);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110;
    b.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 60}px) rotate(${Math.random()*540}deg)`,opacity:0}],
      {duration:800 + Math.random()*400,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish = () => b.remove();
  }
}
function floatText(x, y, text){
  const f = document.createElement('div'); f.className = 'float'; f.textContent = text;
  f.style.left = (x - 30) + 'px'; f.style.top = (y - 20) + 'px'; document.body.appendChild(f);
  f.animate([{transform:'translateY(0) scale(.6)',opacity:1},{transform:'translateY(-70px) scale(1.2)',opacity:0}],{duration:900}).onfinish = () => f.remove();
}
function showToast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function updateHud(){
  $('scoreText').textContent = score;
  $('bar').style.width = (placed / TOTAL * 100) + '%';
  $('barText').textContent = placed + ' / ' + TOTAL;
  const s = $('streak'); s.textContent = '🔥 x' + streak;
  s.classList.toggle('on', streak >= 2);
}

/* ---------- game ---------- */
function shuffle(arr){ return [...arr].sort(() => Math.random() - .5); }

function initGame(){
  score = 0; placed = 0; streak = 0; mistakes = 0;
  $('win').classList.remove('show');
  ['ASK','GIVE','RESPOND'].forEach(k => $('container-' + k).innerHTML = '');
  const pool = $('cardsPool'); pool.innerHTML = '';
  shuffle(EXPRESSIONS_DATA).forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--r', ((Math.random() * 6) - 3).toFixed(1) + 'deg');
    card.style.animationDelay = (i * 45) + 'ms';
    const span = document.createElement('span'); span.textContent = item.text;
    const btn = document.createElement('button');
    btn.className = 'spk'; btn.textContent = '🔊'; btn.title = 'Listen to pronunciation'; btn.setAttribute('aria-label', 'Listen');
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', e => { e.stopPropagation(); speakText(item.text); });
    card.append(span, btn);
    card.dataset.category = item.category; card.dataset.id = item.id; card.dataset.text = item.text;
    card.addEventListener('pointerdown', onPointerDown);
    pool.appendChild(card);
  });
  updateHud();
}

function binAt(x, y){
  let hit = null;
  document.querySelectorAll('.bin').forEach(bin => {
    const r = bin.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = bin;
  });
  return hit;
}

function onPointerDown(e){
  if (e.target.classList.contains('spk') || e.currentTarget.classList.contains('placed')) return;
  activeCard = e.currentTarget; cardOriginalParent = activeCard.parentElement;
  tone(520,0,.05,'sine',.08);
  speakText(activeCard.dataset.text);
  const rect = activeCard.getBoundingClientRect();
  touchOffset.x = e.clientX - rect.left; touchOffset.y = e.clientY - rect.top;
  Object.assign(activeCard.style, {position:'fixed', width:rect.width + 'px', left:rect.left + 'px', top:rect.top + 'px'});
  activeCard.classList.remove('back'); activeCard.classList.add('dragging');
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  e.preventDefault();
}

function onPointerMove(e){
  if (!activeCard) return;
  activeCard.style.left = (e.clientX - touchOffset.x) + 'px';
  activeCard.style.top = (e.clientY - touchOffset.y) + 'px';
  const hit = binAt(e.clientX, e.clientY);
  document.querySelectorAll('.bin').forEach(b => b.classList.toggle('hot', b === hit));
}

function resetCardStyle(card){
  ['position','width','left','top'].forEach(p => card.style.removeProperty(p));
  card.classList.remove('dragging');
}

function onPointerUp(e){
  if (!activeCard) return;
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  const bin = binAt(e.clientX, e.clientY);
  document.querySelectorAll('.bin').forEach(b => b.classList.remove('hot'));
  const target = bin ? bin.dataset.target : null;
  const card = activeCard; activeCard = null;

  if (target && target === card.dataset.category){
    score += 10; placed++; streak++;
    resetCardStyle(card); card.classList.add('placed');
    $('container-' + target).appendChild(card);
    sfxGood(); confetti(e.clientX, e.clientY); floatText(e.clientX, e.clientY, '+10');
    updateHud();
    if (placed === TOTAL) setTimeout(finish, 900);
  } else {
    streak = 0; updateHud();
    if (target){
      mistakes++; sfxBad(); showToast('❌ Kurang tepat! Coba masukkan ke kotak lain.');
      bin.classList.remove('shake'); void bin.offsetWidth; bin.classList.add('shake');
    }
    resetCardStyle(card); cardOriginalParent.appendChild(card);
    card.classList.add('back');
  }
}

function finish(){
  const n = mistakes <= 2 ? 3 : mistakes <= 5 ? 2 : 1;
  $('stars').innerHTML = [0,1,2].map(i => `<span style="animation-delay:${i*.2}s;opacity:${i < n ? 1 : .25}">⭐</span>`).join('');
  $('finalScore').textContent = score;
  $('win').classList.add('show'); sfxWin();
  confetti(innerWidth / 2, innerHeight / 3); confetti(innerWidth / 4, innerHeight / 2); confetti(innerWidth * .75, innerHeight / 2);
}

$('resetBtn').onclick = initGame;
$('againBtn').onclick = initGame;
$('muteBtn').onclick = () => {
  muted = !muted; $('muteBtn').textContent = muted ? '🔕' : '🔔';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
};
window.onload = initGame;
</script>
</body>
</html>
